
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PersonalFinanceApi.slnx

      - name: Build
        run: dotnet build PersonalFinanceApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PersonalFinanceApi.slnx --configuration Release --no-build
        env:
          ConnectionStrings__TestConnection: "Host=localhost;Port=5432;Database=personal_finance;Username=postgres;Password=postgres"
          Jwt__Key: "ci-test-key-must-be-at-least-32-characters-long"

      - name: Publish
        run: dotnet publish PersonalFinanceApi/PersonalFinanceApi.csproj --configuration Release --no-build --output ./publish

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Create migration bundle
        run: |
          dotnet ef migrations bundle \
            --project PersonalFinance.Infrastructure \
            --startup-project PersonalFinanceApi \
            --configuration Release \
            --self-contained \
            --target-runtime linux-x64 \
            --output ./publish/efbundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-api
          path: ./publish
