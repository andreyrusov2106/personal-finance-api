name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PersonalFinanceApi.slnx

      - name: Build
        run: dotnet build PersonalFinanceApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PersonalFinanceApi.slnx --configuration Release --no-build